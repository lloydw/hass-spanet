name: SpaNET integration CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spanet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline pump regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated test dependency
        run: python -m pip install 'PyJWT>=2.9,<3'

      - name: Compile integration Python
        run: python -m compileall -q custom_components/spanet

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  ha-import:
    name: Home Assistant container import (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Import modules in Home Assistant image without networking
        run: |
          docker run --rm --network none \
            -v "$PWD/custom_components:/test/custom_components:ro" \
            --entrypoint python \
            ghcr.io/home-assistant/home-assistant:stable \
            -c '
          import sys
          sys.path.insert(0, "/test")
          from custom_components.spanet import (
              coordinator, sensor, select, switch, spanet, pump_modes,
              pump_options, config_flow,
          )
          assert not hasattr(select, "ENABLE_EXPERIMENTAL_V2_PUMP_SELECT")
          print("PASS: SpaNET modules and options flow import in Home Assistant")
          print("PASS: Pump-mode controls come from saved per-pump options")
          '

  hassfest:
    name: Home Assistant hassfest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate integration metadata
        uses: home-assistant/actions/hassfest@master
